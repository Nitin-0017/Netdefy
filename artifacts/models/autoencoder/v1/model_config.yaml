model:
  name: deep_autoencoder
  version: v1
  description: PyTorch Deep Autoencoder (76-64-32-16-8-16-32-64-76) trained exclusively
    on 100k Monday BENIGN flows
  input_dim: 76
  encoder_dims:
  - 64
  - 32
  - 16
  latent_dim: 8
  decoder_dims:
  - 16
  - 32
  - 64
  activation: relu
  dropout_rate: 0.0
  use_batch_norm: false
  random_seed: 42
training:
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 1.0e-05
  epochs: 100
  batch_size: 512
  early_stopping_patience: 10
  min_delta: 1.0e-05
  device: cpu
  fallback_to_cpu: true
  num_workers: 0
calibration:
  strategy: benign_percentile
  target_percentiles:
  - 95.0
  - 99.0
  - 99.5
  default_percentile: 99.0
inference:
  batch_size: 1024
data:
  benchmark_dir: data/benchmark/v1
  train_file: oneclass_train.parquet
  validation_file: validation.parquet
  test_file: test.parquet
  supplementary_file: supplementary/rare_class_diagnostic.parquet
  label_column: Label
  benign_label: BENIGN
output:
  artifact_dir: artifacts/models/autoencoder/v1
  reports_dir: reports
