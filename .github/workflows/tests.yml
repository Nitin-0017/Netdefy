name: NETDEFY Quality Assurance & CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Lint, Type Check & Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install macOS OpenMP runtime
        if: runner.os == 'macOS'
        run: brew install libomp || true

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: |
          uv run ruff check .

      - name: Run Ruff Format Check
        run: |
          uv run ruff format --check .

      - name: Run Strict MyPy Type Checking
        run: |
          uv run mypy src tests scripts

      - name: Verify Benchmark Dataset Integrity & 20 Invariants
        run: |
          uv run python scripts/validate_benchmark.py --benchmark-dir data/benchmark/v1

      - name: Run Pytest Suite with Coverage
        run: |
          uv run pytest --cov=netdefy --cov-report=xml --cov-report=term

